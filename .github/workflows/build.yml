name: Build Electron App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chrome-profile-tool
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chrome-profile-tool/package-lock.json
      
      - name: Create .env file
        run: |
          echo "GOLOGIN_API_TOKEN=${{ secrets.GOLOGIN_API_TOKEN }}" > .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
        working-directory: chrome-profile-tool
      
      - name: Create Firebase service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json
        working-directory: chrome-profile-tool
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Windows app
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: never
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            chrome-profile-tool/release/*.exe
            chrome-profile-tool/release/*.zip
          retention-days: 30

  build-macos-x64:
    runs-on: macos-13
    defaults:
      run:
        working-directory: chrome-profile-tool
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chrome-profile-tool/package-lock.json
      
      - name: Create .env file
        run: |
          echo "GOLOGIN_API_TOKEN=${{ secrets.GOLOGIN_API_TOKEN }}" > .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
        working-directory: chrome-profile-tool
      
      - name: Create Firebase service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json
        working-directory: chrome-profile-tool
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build macOS Intel (x64) app
        run: npm run package:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: never
      
      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-x64
          path: |
            chrome-profile-tool/release/*-x64.dmg
            chrome-profile-tool/release/*-x64.zip
            chrome-profile-tool/release/*.dmg
            chrome-profile-tool/release/*.zip
          retention-days: 30

  build-macos-arm64:
    runs-on: macos-14
    defaults:
      run:
        working-directory: chrome-profile-tool
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chrome-profile-tool/package-lock.json
      
      - name: Create .env file
        run: |
          echo "GOLOGIN_API_TOKEN=${{ secrets.GOLOGIN_API_TOKEN }}" > .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
        working-directory: chrome-profile-tool
      
      - name: Create Firebase service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json
        working-directory: chrome-profile-tool
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build macOS Apple Silicon (arm64) app
        run: npm run package:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: never
      
      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-arm64
          path: |
            chrome-profile-tool/release/*-arm64.dmg
            chrome-profile-tool/release/*-arm64.zip
            chrome-profile-tool/release/*.dmg
            chrome-profile-tool/release/*.zip
          retention-days: 30

  release:
    needs: [build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-windows
      
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build-x64
          path: release-macos-x64
      
      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build-arm64
          path: release-macos-arm64
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-windows/*
            release-macos-x64/*
            release-macos-arm64/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
